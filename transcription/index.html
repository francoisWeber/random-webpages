<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Outil de Transcription Audio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background-color: #f0f4ff;
        }

        .upload-icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
        }

        .status.loading {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .result-area {
            margin-top: 30px;
        }

        .result-text {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 15px;
        }

        .copy-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .file-info {
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .token-status {
            background-color: #d1ecf1;
            color: #0c5460;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .token-status.error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Transcription Audio</h1>
        
        <div id="tokenStatus" class="token-status">
            <span id="tokenText">Vérification du token API...</span>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Cliquez pour sélectionner ou glissez-déposez un fichier audio</div>
            <div style="color: #999; font-size: 0.9rem;">Formats supportés : MP3, WAV, M4A, FLAC, et plus</div>
            <input type="file" id="fileInput" class="file-input" accept="audio/*">
        </div>

        <div id="fileInfo" class="file-info">
            <strong>Fichier sélectionné :</strong> <span id="fileName"></span><br>
            <strong>Taille :</strong> <span id="fileSize"></span><br>
            <strong>Type :</strong> <span id="fileType"></span>
        </div>

        <button id="transcribeBtn" class="btn" disabled>Transcrire l'Audio</button>

        <div id="status" class="status" style="display: none;"></div>

        <div id="resultArea" class="result-area" style="display: none;">
            <h3>Résultat de la Transcription :</h3>
            <div id="resultText" class="result-text"></div>
            <button id="copyBtn" class="copy-btn">📋 Copier dans le Presse-papiers</button>
        </div>
    </div>

    <script>
        let apiToken = '';
        let selectedFile = null;

        // Extract token from URL fragment
        function extractTokenFromURL() {
            const fragment = window.location.hash.substring(1);
            const params = new URLSearchParams(fragment);
            return params.get('token') || fragment; // Fallback to entire fragment if no param
        }

        // Check if token is valid (basic validation)
        function validateToken(token) {
            return token && token.length > 20; // Basic check for OpenAI token format
        }

        // Initialize token
        function initializeToken() {
            apiToken = extractTokenFromURL();
            const tokenStatus = document.getElementById('tokenStatus');
            const tokenText = document.getElementById('tokenText');

            if (validateToken(apiToken)) {
                tokenText.textContent = `✅ Token API chargé (${apiToken.substring(0, 10)}...)`;
                tokenStatus.className = 'token-status';
            } else {
                tokenText.textContent = '❌ Aucun token API valide trouvé dans l\'URL. Ajoutez #token=VOTRE_TOKEN_OPENAI à l\'URL.';
                tokenStatus.className = 'token-status error';
            }
        }

        // File upload handling
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const transcribeBtn = document.getElementById('transcribeBtn');

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            if (!file.type.startsWith('audio/')) {
                showStatus('Veuillez sélectionner un fichier audio valide.', 'error');
                return;
            }

            selectedFile = file;
            
            // Update file info
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            document.getElementById('fileType').textContent = file.type;
            fileInfo.classList.add('show');
            
            // Enable transcribe button
            transcribeBtn.disabled = false;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Octets';
            const k = 1024;
            const sizes = ['Octets', 'Ko', 'Mo', 'Go'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Transcription handling
        transcribeBtn.addEventListener('click', async () => {
            if (!selectedFile || !apiToken) {
                showStatus('Veuillez sélectionner un fichier et vous assurer que le token API est disponible.', 'error');
                return;
            }

            await transcribeAudio();
        });

        async function transcribeAudio() {
            showStatus('🔄 Transcription de l\'audio en cours... Cela peut prendre quelques instants.', 'loading');
            
            try {
                const formData = new FormData();
                formData.append('file', selectedFile);
                formData.append('model', 'whisper-1');
                formData.append('language', 'fr');

                const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiToken}`
                    },
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();
                
                showStatus('✅ Transcription terminée avec succès !', 'success');
                displayResult(result.text);
                
            } catch (error) {
                console.error('Transcription error:', error);
                showStatus(`❌ Erreur : ${error.message}`, 'error');
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        function displayResult(text) {
            const resultArea = document.getElementById('resultArea');
            const resultText = document.getElementById('resultText');
            
            resultText.textContent = text;
            resultArea.style.display = 'block';
            
            // Scroll to result
            resultArea.scrollIntoView({ behavior: 'smooth' });
        }

        // Copy to clipboard functionality
        document.getElementById('copyBtn').addEventListener('click', async () => {
            const resultText = document.getElementById('resultText').textContent;
            
            try {
                await navigator.clipboard.writeText(resultText);
                const copyBtn = document.getElementById('copyBtn');
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✅ Copié !';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            } catch (err) {
                console.error('Failed to copy text: ', err);
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = resultText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                const copyBtn = document.getElementById('copyBtn');
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✅ Copié !';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            }
        });

        // Initialize the app
        initializeToken();
    </script>
</body>
</html>
