<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Âge de Constance</title>
    <style>
                body::before {
                    content: "";
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100vw;
                    height: 100vh;
                    z-index: 0;
                    background: url('https://images.unsplash.com/photo-1595076590135-e070743b31c5?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center center fixed;
                    background-size: cover;
                    filter: blur(4px) brightness(0.9);
                    opacity: 0.75;
                }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
            z-index: 1;
        }
        .encart {
            background: rgba(200, 217, 243, 0.92);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12);
            padding: 2.5rem 3.5rem;
            font-size: 2rem;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            color: #222;
            position: relative;
            z-index: 2;
        }
        .age {
            font-weight: bold;
            color: #3a6ea5;
        }
    </style>
</head>
<body>
    <div class="encart">
        Constance a <span class="age" id="age"></span>
    </div>
    <script>
        function computeAge(from) {
            const now = new Date();
            let years = now.getFullYear() - from.getFullYear();
            let months = now.getMonth() - from.getMonth();
            let days = now.getDate() - from.getDate();
            let hours = now.getHours() - from.getHours();
            let minutes = now.getMinutes() - from.getMinutes();
            if (minutes < 0) {
                minutes += 60;
                hours--;
            }
            if (hours < 0) {
                hours += 24;
                days--;
            }
            if (days < 0) {
                // Get days in previous month
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                days += prevMonth.getDate();
                months--;
            }
            if (months < 0) {
                months += 12;
                years--;
            }
            return { years, months, days, hours };
        }

        function updateAge() {
            const birth = new Date(2024, 10, 5, 2, 15); // Mois 10 = novembre (0-indexé)
            const { years, months, days, hours } = computeAge(birth);
            let txt = '';
            if (years > 0) txt += years + (years === 1 ? ' an ' : ' ans ');
            if (months > 0) txt += months + (months === 1 ? ' mois ' : ' mois ');
            if (days > 0) txt += days + (days === 1 ? ' jour ' : ' jours ');
            txt += hours + (hours === 1 ? ' heure' : ' heures');
            document.getElementById('age').textContent = txt.trim();
        }
        updateAge();
        setInterval(updateAge, 60 * 1000); // Mettre à jour chaque minute
    </script>
</body>
</html>
