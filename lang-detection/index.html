<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .record-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px 0;
            min-width: 200px;
        }

        .record-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }

        .record-button:active {
            transform: translateY(0);
        }

        .record-button.recording {
            background: linear-gradient(45deg, #ff4757, #c44569);
            animation: pulse 1.5s infinite;
        }

        .record-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .result h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .result p {
            color: #666;
            font-size: 1.1rem;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .api-key-status {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .api-key-status.valid {
            background: #d4edda;
            color: #155724;
        }

        .api-key-status.invalid {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Language Detector</h1>
        
        <div id="apiKeyStatus" class="api-key-status"></div>
        
        <div id="status" class="status"></div>
        
        <button id="recordButton" class="record-button">
            🎤 Start Recording
        </button>
        
        <div id="result" class="result">
            <h3>Detected Language:</h3>
            <p id="languageResult"></p>
        </div>
    </div>

    <script>
        class LanguageDetector {
            constructor() {
                console.log('LanguageDetector constructor called');
                this.mediaRecorder = null;
                this.audioChunks = [];
                this.isRecording = false;
                this.apiKey = null;
                
                this.initializeElements();
                this.checkApiKey();
                this.setupEventListeners();
                console.log('LanguageDetector constructor completed');
            }

            initializeElements() {
                this.recordButton = document.getElementById('recordButton');
                this.status = document.getElementById('status');
                this.result = document.getElementById('result');
                this.languageResult = document.getElementById('languageResult');
                this.apiKeyStatus = document.getElementById('apiKeyStatus');
            }

            checkApiKey() {
                // Extract API key from URL fragment
                const hash = window.location.hash.substring(1);
                const params = new URLSearchParams(hash);
                this.apiKey = params.get('key');
                
                if (this.apiKey) {
                    this.apiKeyStatus.textContent = '✅ API Key loaded from URL';
                    this.apiKeyStatus.className = 'api-key-status valid';
                } else {
                    this.apiKeyStatus.textContent = '❌ No API key found in URL fragment. Add #key=YOUR_API_KEY to the URL';
                    this.apiKeyStatus.className = 'api-key-status invalid';
                }
            }

            setupEventListeners() {
                console.log('Setting up event listeners...');
                console.log('Record button:', this.recordButton);
                
                this.recordButton.addEventListener('click', () => {
                    console.log('Button clicked! Current recording state:', this.isRecording);
                    if (this.isRecording) {
                        this.stopRecording();
                    } else {
                        this.startRecording();
                    }
                });
                
                console.log('Event listener added successfully');
            }

            async startRecording() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    this.mediaRecorder = new MediaRecorder(stream);
                    this.audioChunks = [];

                    this.mediaRecorder.ondataavailable = (event) => {
                        this.audioChunks.push(event.data);
                    };

                    this.mediaRecorder.onstop = () => {
                        this.processAudio();
                    };

                    this.mediaRecorder.start();
                    this.isRecording = true;
                    this.updateUI();
                    this.showStatus('Recording... Speak now!', 'info');

                } catch (error) {
                    this.showStatus('Error accessing microphone: ' + error.message, 'error');
                    console.error('Microphone access error:', error);
                }
            }

            stopRecording() {
                if (this.mediaRecorder && this.isRecording) {
                    this.mediaRecorder.stop();
                    this.mediaRecorder.stream.getTracks().forEach(track => track.stop());
                    this.isRecording = false;
                    this.updateUI();
                    this.showStatus('Processing audio...', 'info');
                }
            }

            async processAudio() {
                const audioBlob = new Blob(this.audioChunks, { type: 'audio/wav' });
                
                if (!this.apiKey) {
                    this.showStatus('Recording completed! Add API key to URL (#key=YOUR_API_KEY) to detect language.', 'info');
                    return;
                }
                
                try {
                    // Convert audio to base64
                    const base64Audio = await this.blobToBase64(audioBlob);
                    
                    // Send to OpenAI
                    const language = await this.detectLanguage(base64Audio);
                    
                    this.showResult(language);
                    this.showStatus('Language detected successfully!', 'success');
                    
                } catch (error) {
                    this.showStatus('Error processing audio: ' + error.message, 'error');
                    console.error('Audio processing error:', error);
                }
            }

            async detectLanguage(base64Audio) {
                const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${this.apiKey}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'whisper-1',
                        file: base64Audio,
                        prompt: 'what is the language of this sample ?',
                        response_format: 'text'
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `HTTP ${response.status}: ${response.statusText}`);
                }

                return await response.text();
            }

            blobToBase64(blob) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => {
                        const base64 = reader.result.split(',')[1];
                        resolve(base64);
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            }

            updateUI() {
                if (this.isRecording) {
                    this.recordButton.textContent = '⏹️ Stop Recording';
                    this.recordButton.className = 'record-button recording';
                } else {
                    this.recordButton.textContent = '🎤 Start Recording';
                    this.recordButton.className = 'record-button';
                    this.recordButton.disabled = false;
                }
            }

            showStatus(message, type) {
                this.status.textContent = message;
                this.status.className = `status ${type}`;
                this.status.style.display = 'block';
                
                if (type === 'success') {
                    setTimeout(() => {
                        this.status.style.display = 'none';
                    }, 3000);
                }
            }

            showResult(language) {
                this.languageResult.textContent = language;
                this.result.style.display = 'block';
            }
        }

        // Initialize the app when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, initializing LanguageDetector...');
            try {
                const detector = new LanguageDetector();
                console.log('LanguageDetector initialized successfully');
                
                // Double-check button is connected
                const btn = document.getElementById('recordButton');
                console.log('Button element:', btn);
                console.log('Button has click listener:', btn.onclick !== null);
                
            } catch (error) {
                console.error('Error initializing LanguageDetector:', error);
            }
        });
    </script>
</body>
</html>
