<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .recording-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .record-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .stop-button {
            background: linear-gradient(45deg, #ff4757, #c44569);
        }

        .record-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }

        .record-button:active {
            transform: translateY(0);
        }

        .record-button.recording {
            background: linear-gradient(45deg, #ff4757, #c44569);
            animation: pulse 1.5s infinite;
        }

        .record-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .result h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .result p {
            color: #666;
            font-size: 1.1rem;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .api-key-status {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .api-key-status.valid {
            background: #d4edda;
            color: #155724;
        }

        .api-key-status.invalid {
            background: #f8d7da;
            color: #721c24;
        }

        .recording-timer {
            margin: 20px 0;
            padding: 15px;
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            text-align: center;
        }

        .timer-display {
            font-size: 1.2rem;
            font-weight: 600;
            color: #856404;
        }

        .recording-timer .timer-display span {
            color: #dc3545;
            font-family: 'Courier New', monospace;
            font-size: 1.4rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Language Detector</h1>
        
        <div id="apiKeyStatus" class="api-key-status"></div>
        
        <div id="status" class="status"></div>
        
        <div class="recording-controls">
            <button id="recordButton" class="record-button">
                🎤 Start Recording
            </button>
            <button id="stopButton" class="record-button stop-button" style="display: none;">
                ⏹️ Stop Recording
            </button>
        </div>
        
        <div id="recordingTimer" class="recording-timer" style="display: none;">
            <div class="timer-display">
                🔴 Recording: <span id="timerText">00:00</span>
            </div>
        </div>
        
        <div id="result" class="result">
            <h3>🌍 Detected Language:</h3>
            <p id="languageResult"></p>
        </div>
    </div>

    <script>
        class LanguageDetector {
            constructor() {
                console.log('LanguageDetector constructor called');
                this.mediaRecorder = null;
                this.audioChunks = [];
                this.isRecording = false;
                this.apiKey = null;
                this.recordingStartTime = null;
                this.timerInterval = null;
                
                this.initializeElements();
                this.checkApiKey();
                this.setupEventListeners();
                console.log('LanguageDetector constructor completed');
            }

            initializeElements() {
                this.recordButton = document.getElementById('recordButton');
                this.stopButton = document.getElementById('stopButton');
                this.status = document.getElementById('status');
                this.result = document.getElementById('result');
                this.languageResult = document.getElementById('languageResult');
                this.apiKeyStatus = document.getElementById('apiKeyStatus');
                this.recordingTimer = document.getElementById('recordingTimer');
                this.timerText = document.getElementById('timerText');
            }

            checkApiKey() {
                // Extract API key from URL fragment
                const hash = window.location.hash.substring(1);
                const params = new URLSearchParams(hash);
                this.apiKey = params.get('key');
                
                if (this.apiKey) {
                    this.apiKeyStatus.textContent = '✅ API Key loaded from URL';
                    this.apiKeyStatus.className = 'api-key-status valid';
                } else {
                    this.apiKeyStatus.textContent = '❌ No API key found in URL fragment. Add #key=YOUR_API_KEY to the URL';
                    this.apiKeyStatus.className = 'api-key-status invalid';
                }
            }

            setupEventListeners() {
                console.log('Setting up event listeners...');
                console.log('Record button:', this.recordButton);
                console.log('Stop button:', this.stopButton);
                
                this.recordButton.addEventListener('click', () => {
                    console.log('Record button clicked!');
                    this.startRecording();
                });

                this.stopButton.addEventListener('click', () => {
                    console.log('Stop button clicked!');
                    this.stopRecording();
                });
                
                console.log('Event listeners added successfully');
            }

            async startRecording() {
                if (this.isRecording) {
                    console.log('Already recording, ignoring start request');
                    return;
                }

                try {
                    console.log('Starting recording process...');
                    
                    // Check if MediaRecorder is supported
                    if (!window.MediaRecorder) {
                        throw new Error('MediaRecorder is not supported in this browser');
                    }

                    console.log('Requesting microphone access...');
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            sampleRate: 44100
                        } 
                    });
                    
                    console.log('Microphone access granted, got stream:', stream);
                    console.log('Audio tracks:', stream.getAudioTracks());
                    
                    // Check for supported MIME types
                    let mimeType = 'audio/webm';
                    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                        mimeType = 'audio/webm;codecs=opus';
                    } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
                        mimeType = 'audio/mp4';
                    } else if (MediaRecorder.isTypeSupported('audio/wav')) {
                        mimeType = 'audio/wav';
                    }
                    
                    console.log('Using MIME type:', mimeType);
                    console.log('Creating MediaRecorder...');
                    
                    this.mediaRecorder = new MediaRecorder(stream, { mimeType });
                    this.audioChunks = [];

                    this.mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            this.audioChunks.push(event.data);
                            console.log('Audio chunk received:', event.data.size, 'bytes');
                        }
                    };

                    this.mediaRecorder.onstop = () => {
                        console.log('Recording stopped, processing audio...');
                        this.stopTimer();
                        this.processAudio();
                    };

                    this.mediaRecorder.onstart = () => {
                        console.log('MediaRecorder started successfully!');
                        this.isRecording = true;
                        this.updateUI();
                        this.startTimer();
                        this.showStatus('Recording... Speak now!', 'info');
                    };

                    this.mediaRecorder.onerror = (event) => {
                        console.error('MediaRecorder error:', event.error);
                        this.showStatus('Recording error: ' + event.error.message, 'error');
                        this.isRecording = false;
                        this.updateUI();
                        this.stopTimer();
                    };

                    console.log('Starting MediaRecorder...');
                    this.mediaRecorder.start(100); // Collect data every 100ms

                } catch (error) {
                    this.showStatus('Error accessing microphone: ' + error.message, 'error');
                    console.error('Microphone access error:', error);
                    this.isRecording = false;
                    this.updateUI();
                    this.stopTimer();
                }
            }

            stopRecording() {
                if (this.mediaRecorder && this.isRecording) {
                    console.log('Stopping recording...');
                    this.mediaRecorder.stop();
                    
                    // Stop all tracks to release the microphone
                    if (this.mediaRecorder.stream) {
                        this.mediaRecorder.stream.getTracks().forEach(track => {
                            track.stop();
                            console.log('Track stopped:', track.kind);
                        });
                    }
                    
                    this.isRecording = false;
                    this.updateUI();
                    this.showStatus('Processing audio...', 'info');
                }
            }

            async processAudio() {
                const duration = this.getRecordingDuration();
                
                // Check if we have any audio data
                if (this.audioChunks.length === 0) {
                    this.showStatus('No audio data recorded. Please try again.', 'error');
                    return;
                }

                // Create blob with the correct MIME type
                const mimeType = this.mediaRecorder.mimeType || 'audio/webm';
                const audioBlob = new Blob(this.audioChunks, { type: mimeType });
                
                console.log('Audio blob created:', {
                    size: audioBlob.size,
                    type: audioBlob.type,
                    chunks: this.audioChunks.length,
                    duration: duration + ' seconds'
                });

                // Display recording info
                this.showStatus(`Recording completed! Duration: ${duration} seconds, Size: ${Math.round(audioBlob.size / 1024)}KB`, 'success');

                // Check if the blob is too small (likely no audio recorded)
                if (audioBlob.size < 1000) { // Less than 1KB
                    this.showStatus(`Recording too short (${duration}s, ${Math.round(audioBlob.size / 1024)}KB). Please speak for at least 2-3 seconds.`, 'error');
                    return;
                }
                
                if (!this.apiKey) {
                    this.showStatus(`Recording completed! Duration: ${duration}s. Add API key to URL (#key=YOUR_API_KEY) to detect language.`, 'info');
                    return;
                }
                
                try {
                    // Send to OpenAI using FormData
                    this.showStatus('Analyzing language...', 'info');
                    const result = await this.detectLanguage(audioBlob);
                    
                    this.showResult(result);
                    this.showStatus(`Language detected successfully! (${duration}s recording)`, 'success');
                    
                } catch (error) {
                    this.showStatus('Error processing audio: ' + error.message, 'error');
                    console.error('Audio processing error:', error);
                }
            }

            async detectLanguage(audioBlob) {
                const formData = new FormData();
                formData.append('file', audioBlob, 'audio.webm');
                formData.append('model', 'whisper-1');
                formData.append('response_format', 'verbose_json');

                const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${this.apiKey}`,
                    },
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();
                console.log('OpenAI response:', result);
                
                // Whisper returns language in the response when using verbose_json
                if (result.language) {
                    return this.getLanguageName(result.language);
                } else {
                    // Fallback: use GPT to analyze the transcribed text for language
                    return await this.detectLanguageFromText(result.text || 'No text detected');
                }
            }

            getLanguageName(languageCode) {
                const languageMap = {
                    'en': 'English',
                    'es': 'Spanish',
                    'fr': 'French',
                    'de': 'German',
                    'it': 'Italian',
                    'pt': 'Portuguese',
                    'ru': 'Russian',
                    'ja': 'Japanese',
                    'ko': 'Korean',
                    'zh': 'Chinese',
                    'ar': 'Arabic',
                    'hi': 'Hindi',
                    'nl': 'Dutch',
                    'sv': 'Swedish',
                    'da': 'Danish',
                    'no': 'Norwegian',
                    'fi': 'Finnish',
                    'pl': 'Polish',
                    'tr': 'Turkish',
                    'el': 'Greek',
                    'he': 'Hebrew',
                    'th': 'Thai',
                    'vi': 'Vietnamese',
                    'cs': 'Czech',
                    'hu': 'Hungarian',
                    'ro': 'Romanian',
                    'bg': 'Bulgarian',
                    'hr': 'Croatian',
                    'sk': 'Slovak',
                    'sl': 'Slovenian',
                    'et': 'Estonian',
                    'lv': 'Latvian',
                    'lt': 'Lithuanian',
                    'uk': 'Ukrainian',
                    'id': 'Indonesian',
                    'ms': 'Malay',
                    'tl': 'Filipino',
                    'ca': 'Catalan'
                };
                
                return languageMap[languageCode] || `${languageCode.toUpperCase()} (${languageCode})`;
            }

            async detectLanguageFromText(text) {
                // Fallback method using GPT to detect language from transcribed text
                try {
                    const response = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${this.apiKey}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            model: 'gpt-3.5-turbo',
                            messages: [{
                                role: 'user',
                                content: `What language is this text written in? Respond with only the language name: "${text}"`
                            }],
                            max_tokens: 10,
                            temperature: 0
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const result = await response.json();
                    return result.choices[0]?.message?.content?.trim() || 'Unknown language';
                } catch (error) {
                    console.error('Fallback language detection failed:', error);
                    return 'Language detection failed';
                }
            }

            startTimer() {
                this.recordingStartTime = Date.now();
                this.recordingTimer.style.display = 'block';
                this.timerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - this.recordingStartTime) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    this.timerText.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }, 1000);
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
                this.recordingTimer.style.display = 'none';
            }

            getRecordingDuration() {
                if (this.recordingStartTime) {
                    return Math.floor((Date.now() - this.recordingStartTime) / 1000);
                }
                return 0;
            }

            updateUI() {
                if (this.isRecording) {
                    this.recordButton.style.display = 'none';
                    this.stopButton.style.display = 'inline-block';
                } else {
                    this.recordButton.style.display = 'inline-block';
                    this.stopButton.style.display = 'none';
                    this.recordButton.disabled = false;
                }
            }

            showStatus(message, type) {
                this.status.textContent = message;
                this.status.className = `status ${type}`;
                this.status.style.display = 'block';
                
                if (type === 'success') {
                    setTimeout(() => {
                        this.status.style.display = 'none';
                    }, 3000);
                }
            }

            showResult(language) {
                this.languageResult.textContent = language;
                this.result.style.display = 'block';
            }
        }

        // Initialize the app when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, initializing LanguageDetector...');
            try {
                const detector = new LanguageDetector();
                console.log('LanguageDetector initialized successfully');
                
                // Double-check button is connected
                const btn = document.getElementById('recordButton');
                console.log('Button element:', btn);
                console.log('Button has click listener:', btn.onclick !== null);
                
            } catch (error) {
                console.error('Error initializing LanguageDetector:', error);
            }
        });
    </script>
</body>
</html>
